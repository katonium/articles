# Beam YAML パイプライン: CSV → BigQuery (Python + SQL ハイブリッドチェーン)
#
# Python (MapToFields / Filter) と SQL (Sql) を同じパイプラインで混在させて
# 各自の得意領域を活かすパターン。
#
# 制約: PyTransform の __callable__ で beam.Row を返すと、Python ネイティブ型が
# cross-language 境界で "pythonsdk_any:v1" に化けて Java 側 BigQueryIO がデコードできない。
# → 型変換 (CAST / TIMESTAMPADD) は Sql ノードに任せ、Python は単純な列選択と
#   フィルタリングに使うのが安全なパターン。

pipeline:
  type: composite
  transforms:
    - type: ReadFromCsv
      name: Read
      config:
        path: "{{ input_path }}"

    # Step 1: Python MapToFields で secret カラムを削除
    # fields に列挙したフィールドだけが残る
    - type: MapToFields
      name: DropSecret
      input: Read
      config:
        language: python
        fields:
          id: id
          name: name
          event_at_utc: event_at_utc

    # Step 2: Sql で UTC→JST 変換 + 型を TIMESTAMP に CAST
    # 型変換は Java/Calcite 側でやることで cross-language の型消失を回避する
    - type: Sql
      name: ConvertToJst
      input: DropSecret
      config:
        query: |
          SELECT
            CAST(id AS BIGINT) AS id,
            name,
            TIMESTAMPADD(HOUR, 9, CAST(event_at_utc AS TIMESTAMP)) AS event_at_jst
          FROM PCOLLECTION

    # Step 3: Python Filter で name が NULL の行を除去
    - type: Filter
      name: FilterNulls
      input: ConvertToJst
      config:
        language: python
        keep: "name is not None"

    - type: WriteToBigQuery
      name: Write
      input: FilterNulls
      config:
        table: "{{ project }}.{{ dataset }}.{{ prefix }}_result"
        create_disposition: CREATE_NEVER
        write_disposition: WRITE_APPEND
