# Beam YAML パイプライン: CSV → BigQuery (インライン Python で全変換ステップをチェーン)
#
# csv.yaml と同じ入力・出力だが、変換ロジックを SQL ではなくインライン Python で書く。
# 2 つの Python スタイルを直列チェーンで示す:
#   Step 1: PyTransform (__callable__) で secret 削除 + UTC→JST 変換
#   Step 2: Filter (language: python) で NULL 行除去

pipeline:
  type: composite
  transforms:
    - type: ReadFromCsv
      name: Read
      config:
        path: "{{ input_path }}"

    # Step 1: secret 削除 + UTC→JST (import が必要なので PyTransform)
    - type: PyTransform
      name: DropColAndConvert
      input: Read
      config:
        constructor: __callable__
        kwargs:
          source: |
            def transform(pcoll):
              import apache_beam as beam
              from datetime import datetime, timedelta

              def cleanse(row):
                utc = datetime.strptime(row.event_at_utc, "%Y-%m-%d %H:%M:%S")
                jst = utc + timedelta(hours=9)
                return beam.Row(
                  id=row.id,
                  name=row.name,
                  event_at_jst=jst.strftime("%Y-%m-%d %H:%M:%S"),
                )

              return pcoll | "Cleanse" >> beam.Map(cleanse)

    # Step 2: name が NULL の行を除去 (1 行 Python 述語)
    - type: Filter
      name: FilterNulls
      input: DropColAndConvert
      config:
        language: python
        keep: "name is not None"

    - type: WriteToBigQuery
      name: Write
      input: FilterNulls
      config:
        table: "{{ project }}.{{ dataset }}.{{ prefix }}_result"
        create_disposition: CREATE_NEVER
        write_disposition: WRITE_APPEND
