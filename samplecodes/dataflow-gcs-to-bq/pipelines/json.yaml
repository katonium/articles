# Beam YAML パイプライン: NDJSON → BigQuery
#
# ReadFromJson は内部で pandas read_json を使うため、改行区切り JSON は
# lines: true を指定して読む。

pipeline:
  type: composite
  transforms:
    - type: ReadFromJson
      name: Read
      config:
        path: "{{ input_path }}"
        lines: true

    - type: Sql
      name: DropCol
      input: Read
      config:
        query: |
          SELECT
            CAST(id AS BIGINT) AS id,
            name,
            CAST(event_at_utc AS TIMESTAMP) AS event_at_utc
          FROM PCOLLECTION

    - type: WriteToBigQuery
      name: WriteDropCol
      input: DropCol
      config:
        table: "{{ project }}.{{ dataset }}.{{ prefix }}_drop_col"
        create_disposition: CREATE_NEVER
        write_disposition: WRITE_APPEND

    - type: Sql
      name: UtcJst
      input: Read
      config:
        query: |
          SELECT
            CAST(id AS BIGINT) AS id,
            name,
            secret,
            TIMESTAMPADD(HOUR, 9, CAST(event_at_utc AS TIMESTAMP)) AS event_at_jst
          FROM PCOLLECTION

    - type: WriteToBigQuery
      name: WriteUtcJst
      input: UtcJst
      config:
        table: "{{ project }}.{{ dataset }}.{{ prefix }}_utc_jst"
        create_disposition: CREATE_NEVER
        write_disposition: WRITE_APPEND

    - type: Sql
      name: NullDrop
      input: Read
      config:
        query: |
          SELECT
            CAST(id AS BIGINT) AS id,
            name,
            secret,
            CAST(event_at_utc AS TIMESTAMP) AS event_at_utc
          FROM PCOLLECTION
          WHERE name IS NOT NULL

    - type: WriteToBigQuery
      name: WriteNullDrop
      input: NullDrop
      config:
        table: "{{ project }}.{{ dataset }}.{{ prefix }}_null_drop"
        create_disposition: CREATE_NEVER
        write_disposition: WRITE_APPEND
